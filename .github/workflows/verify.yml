name: Verify Folio Web

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test web application
        run: npm run check
      - name: Test document importer
        run: GO111MODULE=off go test ./tests/go
      - name: Check JavaScript syntax
        run: |
          for file in docs/*.js docs/wasm/import-worker.js; do
            node --check "$file"
          done
